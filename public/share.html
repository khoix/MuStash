<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111315" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>MuStash share</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../share-layout.css">
  <script type="module" src="../share.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href=".." aria-label="MuStash home">
      <img src="../icons/mustash.svg" alt="" width="38" height="38">
      <span>MuStash</span>
    </a>
    <div class="menu-wrap">
      <button class="icon-button menu-toggle" id="menuToggle" type="button" aria-label="Open menu" aria-haspopup="true" aria-expanded="false" aria-controls="appMenu" data-testid="menu-toggle">
        <span class="hamburger" aria-hidden="true"><span></span><span></span><span></span></span>
      </button>
      <nav class="app-menu" id="appMenu" aria-label="App menu" hidden>
        <button class="menu-item theme-menu-item" id="themeToggle" type="button" aria-pressed="false" data-testid="theme-toggle">
          <span class="menu-icon" aria-hidden="true">☾</span>
          <span class="menu-copy"><strong>Dark mode</strong><small>Switch appearance</small></span>
          <span class="toggle-track" aria-hidden="true"><span class="toggle-knob"></span></span>
        </button>
        <button class="menu-item" type="button" disabled aria-disabled="true" aria-label="Settings, coming soon" data-testid="settings-item">
          <span class="menu-icon" aria-hidden="true">⚙</span>
          <span class="menu-copy"><strong>Settings</strong><small>More options later</small></span>
          <span class="soon-pill" aria-hidden="true">Soon</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="shell share-shell">
    <section class="card share-card" id="shareCard">
      <div id="loadingState" class="center-state">
        <div class="spinner" aria-hidden="true"></div>
        <p>Opening stash…</p>
      </div>

      <div id="expiredState" class="center-state" hidden>
        <div class="big-mark" aria-hidden="true">〰</div>
        <h1>This stash is gone.</h1>
        <p>It expired or no longer exists.</p>
        <a class="primary-button link-button" href="..">Make a new stash</a>
      </div>

      <form id="unlockForm" class="unlock-form" hidden>
        <div class="big-mark" aria-hidden="true">⌁</div>
        <h1>Protected stash</h1>
        <p>Enter the password to preview this stash.</p>
        <label class="field">
          <span>Password</span>
          <input id="unlockPassword" type="password" minlength="8" maxlength="128" autocomplete="current-password" required data-testid="unlock-password">
        </label>
        <button class="primary-button" type="submit" data-testid="unlock-button">Unlock</button>
        <p class="status" id="unlockStatus" role="status" aria-live="polite"></p>
      </form>

      <div id="mediaState" hidden data-testid="media-state">
        <div class="media-heading">
          <p class="eyebrow" id="fileName">Stash</p>
          <div class="pill-row" data-testid="share-tags">
            <span class="protected-pill" id="protectedPill" hidden>Protected</span>
            <span class="protected-pill preview-only-pill" id="previewOnlyPill" hidden data-testid="preview-only-pill">Preview only</span>
          </div>
        </div>
        <div class="media-frame" id="mediaFrame"></div>
        <div class="stash-file-list" id="stashFileList" hidden data-testid="stash-file-list"></div>
        <div class="media-meta-line" data-testid="media-meta-line">
          <span id="fileSize"></span>
          <span id="expiryLine"></span>
        </div>

        <div class="download-panel" id="downloadPanel" hidden data-testid="download-panel">
          <div class="download-panel-heading">
            <strong>Select files to download</strong>
            <button class="download-select-all" id="downloadSelectAll" type="button">Select all</button>
          </div>
          <div class="download-file-list" id="downloadFileList"></div>
          <p class="status" id="downloadStatus" role="status" aria-live="polite"></p>
          <div class="download-panel-actions">
            <button class="secondary-button" id="downloadCancel" type="button">Cancel</button>
            <button class="primary-button" id="downloadSelected" type="button" data-testid="download-selected">Download selected</button>
          </div>
        </div>

        <div class="button-row share-actions">
          <button class="primary-button" id="shareButton" type="button">Share</button>
          <a class="secondary-button link-button" id="downloadButton" data-testid="download-button">Download</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111315" media="(prefers-color-scheme: dark)">
  <meta name="description" content="MuStash — temporary file sharing without the clutter.">
  <title>MuStash — temporary file sharing</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="preview-controls.css">
  <link rel="stylesheet" href="multi-upload.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="." aria-label="MuStash home">
      <img src="icons/mustash.svg" alt="" width="38" height="38">
      <span>MuStash</span>
    </a>
    <div class="menu-wrap">
      <button class="icon-button menu-toggle" id="menuToggle" type="button" aria-label="Open menu" aria-haspopup="true" aria-expanded="false" aria-controls="appMenu" data-testid="menu-toggle">
        <span class="hamburger" aria-hidden="true"><span></span><span></span><span></span></span>
      </button>
      <nav class="app-menu" id="appMenu" aria-label="App menu" hidden>
        <button class="menu-item theme-menu-item" id="themeToggle" type="button" aria-pressed="false" data-testid="theme-toggle">
          <span class="menu-icon" aria-hidden="true">☾</span>
          <span class="menu-copy"><strong>Dark mode</strong><small>Switch appearance</small></span>
          <span class="toggle-track" aria-hidden="true"><span class="toggle-knob"></span></span>
        </button>
        <button class="menu-item" type="button" disabled aria-disabled="true" aria-label="Settings, coming soon" data-testid="settings-item">
          <span class="menu-icon" aria-hidden="true">⚙</span>
          <span class="menu-copy"><strong>Settings</strong><small>More options later</small></span>
          <span class="soon-pill" aria-hidden="true">Soon</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="shell">
    <section class="hero">
      <p class="eyebrow">µ stash · tiny, temporary, yours</p>
      <h1>Drop it. Share it.<br><span>Let it disappear.</span></h1>
      <p class="lede">A lightweight place to stash stuff for a little while.</p>
    </section>

    <section class="card" id="uploadCard">
      <form id="uploadForm" novalidate>
        <label class="field stash-name-field" id="stashNameField" hidden data-testid="stash-name-field">
          <span>Stash name <small>optional</small></span>
          <input id="stashName" name="stashName" type="text" maxlength="80" autocomplete="off" placeholder="Name this stash" data-testid="stash-name-input">
        </label>

        <label class="dropzone" id="dropzone" for="fileInput" data-drag-enabled="false">
          <input id="fileInput" name="file" type="file" multiple required data-testid="file-input">
          <span class="drop-icon" aria-hidden="true">↥</span>
          <strong>Choose files</strong>
          <span id="dropHint" data-testid="drop-hint" hidden>or drop them here</span>
          <small id="limitText">Media, PDF, Office/OpenDocument, and UTF-8 text files</small>
        </label>

        <div class="preview multi-preview" id="localPreview" hidden aria-live="polite"></div>

        <div class="settings-grid">
          <label class="field settings-ttl">
            <span>Keep for</span>
            <div class="ttl-control">
              <div class="input-suffix">
                <input id="ttlHours" name="ttlHours" type="number" value="24" min="0.25" step="0.25" inputmode="decimal" data-testid="ttl-input">
                <span>hours</span>
              </div>
              <div class="number-steppers" role="group" aria-label="Adjust hours">
                <button type="button" class="stepper" data-dir="1" aria-label="Increase hours" tabindex="-1"></button>
                <button type="button" class="stepper" data-dir="-1" aria-label="Decrease hours" tabindex="-1"></button>
              </div>
            </div>
          </label>

          <label class="field settings-password">
            <span>Access password <small>optional</small></span>
            <div class="input-with-icon">
              <input id="password" type="password" minlength="8" maxlength="128" autocomplete="new-password" placeholder="At least 8 characters" data-testid="password-input">
              <span class="field-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="4" y="11" width="16" height="10" rx="2"></rect>
                  <path d="M8 11V8a4 4 0 0 1 8 0v3"></path>
                </svg>
              </span>
            </div>
          </label>

          <label class="download-option settings-download">
            <input id="allowDownload" type="checkbox" checked data-testid="allow-download">
            <span class="download-option-copy">
              <strong>Allow Download</strong>
            </span>
          </label>
        </div>

        <button class="primary-button" id="stashButton" type="submit" data-testid="stash-button">Stash it</button>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <div class="result-overlay" id="resultOverlay" hidden data-testid="result-overlay">
    <button class="result-overlay-backdrop" id="resultBackdrop" type="button" aria-label="Dismiss share dialog" tabindex="-1"></button>
    <section class="card result-card" id="resultCard" role="dialog" aria-modal="true" aria-labelledby="resultTitle" data-testid="result-card">
      <button class="icon-button result-close" id="resultClose" type="button" aria-label="Close" data-testid="result-close">
        <span aria-hidden="true">×</span>
      </button>
      <div>
        <p class="eyebrow">Stashed</p>
        <h2 id="resultTitle">Your share is ready.</h2>
        <p id="expiryText"></p>
      </div>
      <div class="stash-link-field">
        <div class="link-row">
          <input id="stashLink" class="stash-link-input" type="text" readonly aria-label="Stash link, click to copy" aria-describedby="stashLinkHint" title="Click to copy" data-testid="share-url">
          <button class="secondary-button" id="copyButton" type="button">Copy</button>
        </div>
        <p class="stash-link-hint" id="stashLinkHint" aria-live="polite" data-testid="share-url-hint">Tap the link to copy it</p>
      </div>
      <div class="button-row">
        <button class="primary-button" id="sendButton" type="button">Share</button>
        <a class="secondary-button link-button" id="openButton" target="_blank" rel="noopener">Open preview</a>
      </div>
    </section>
  </div>

  <footer>MuStash <span aria-hidden="true">〰</span> Nothing lasts forever.</footer>
</body>
</html>
